<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สมุดจองล็อค</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: งานเทศกาล (รายการ) → ผังโซนที่ย่อ/ขยายได้ → แตะเลขล็อคเปิดแผ่นบันทึกที่พอดีหนึ่งจอ.
   Compact controls throughout. Colors follow stall colors on a festival floor plan:
   magenta accent; amber / blue / green for booking state; gold for popularity stars. */
:root {
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-display: "Prompt", "IBM Plex Sans Thai", system-ui, sans-serif;
  --bg: #f1f2f7;
  --surface: #ffffff;
  --surface2: #e7e9f1;
  --ink: #1b1f2e;
  --muted: #596078;
  --line: #d6d9e4;
  --accent: #c2185b;
  --accent-ink: #ffffff;
  --book: #8a5700;
  --book-bg: #fcecc6;
  --dep: #1a56b0;
  --dep-bg: #d9e7fb;
  --paid: #17703d;
  --paid-bg: #d3f0df;
  --star: #c27a00;
  --warn-bg: #fff0cf;
  --warn-ink: #6b4300;
  --danger: #b3261e;
  --scrim: rgba(10, 12, 20, .55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1b1e28; --surface2: #262a37; --ink: #eceef6; --muted: #9aa2b8; --line: #333849;
    --accent: #ff6aa6; --accent-ink: #2a0618;
    --book: #ffe0a0; --book-bg: #6a5018; --dep: #c4dbff; --dep-bg: #2c5290; --paid: #aef5cc; --paid-bg: #226a44;
    --star: #ffcf4d; --warn-bg: #3a2d10; --warn-ink: #f6d58e; --danger: #ff8f86; --scrim: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1b1e28; --surface2: #262a37; --ink: #eceef6; --muted: #9aa2b8; --line: #333849;
  --accent: #ff6aa6; --accent-ink: #2a0618;
  --book: #ffe0a0; --book-bg: #6a5018; --dep: #c4dbff; --dep-bg: #2c5290; --paid: #aef5cc; --paid-bg: #226a44;
  --star: #ffcf4d; --warn-bg: #3a2d10; --warn-ink: #f6d58e; --danger: #ff8f86; --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body);
  padding-block: 10px 40px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.hl { display: flex; align-items: flex-start; gap: 8px; min-width: 0; flex: 1; }
.back { flex: none; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font: 600 22px/1 var(--font-display); padding: 0; }
h1 { font: 600 20px/1.25 var(--font-display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font: 600 16px/1.3 var(--font-display); margin: 0; }
.sub { color: var(--muted); font-size: 12px; margin: 0; }
.sync { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 2px 10px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"] .dot { background: var(--paid); }
.sync[data-s="busy"] .dot { background: var(--book); }
.sync[data-s="err"] .dot { background: var(--danger); }

.stack { display: flex; flex-direction: column; gap: 10px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 9px; padding: 8px 12px; font-size: 13px; }
.lbl { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
input[type=text], input[type=tel], input[type=search], input[type=number], select, textarea {
  width: 100%; min-height: 38px; padding: 0 11px; font-size: 15px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 9px; min-width: 0;
}
textarea { padding: 8px 11px; min-height: 90px; font-size: 13px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
.price-wrap { position: relative; }
.price-wrap span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; pointer-events: none; }
.price-wrap input { padding-left: 28px; font: 600 20px/1 var(--font-display); min-height: 44px; font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 30px; padding: 0 11px; border-radius: 15px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip.ghost { border-style: dashed; color: var(--muted); }
.btn { min-height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font: 600 15px/1 var(--font-display); }
.btn.small { min-height: 30px; padding: 0 10px; font-size: 13px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.seg button { min-height: 34px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.seg.st button[aria-pressed="true"][data-st="book"] { background: var(--book-bg); color: var(--book); border-color: var(--book); }
.seg.st button[aria-pressed="true"][data-st="dep"] { background: var(--dep-bg); color: var(--dep); border-color: var(--dep); }
.seg.st button[aria-pressed="true"][data-st="paid"] { background: var(--paid-bg); color: var(--paid); border-color: var(--paid); }

/* รายการงาน */
.evlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.evcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.evcard .nm { font: 600 16px/1.3 var(--font-display); overflow-wrap: anywhere; }
.evcard .mt { color: var(--muted); font-size: 12px; }
.prog { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.evcard .ft { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }

/* ผังล็อค */
.summary { display: flex; flex-wrap: wrap; gap: 4px 22px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.summary div { display: flex; flex-direction: column; min-width: 0; }
.summary b { font: 600 17px/1.3 var(--font-display); font-variant-numeric: tabular-nums; }
.summary small { color: var(--muted); font-size: 11px; }
.hot { display: flex; align-items: center; gap: 6px; }
.hot .lbl { flex: none; color: var(--star); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.legend .key { padding: 0 8px; font-size: 12px; }
.zgroup { display: flex; flex-direction: column; gap: 6px; }
.zhead { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 4px 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
.zhead .chev { flex: none; width: 14px; color: var(--muted); transition: transform .15s; }
.zhead[aria-expanded="true"] .chev { transform: rotate(90deg); }
.zhead .zn { font: 600 15px/1.2 var(--font-display); overflow-wrap: anywhere; }
.zhead .zt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: auto; text-align: right; }
.zhead .zbar { flex: none; width: 44px; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.zhead .zbar i { display: block; height: 100%; background: var(--accent); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 5px; }
.cell { position: relative; min-height: 46px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 6px 1px 2px; border: 1px solid color-mix(in srgb, currentColor 35%, transparent); font: 600 15px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.cell small { font: 500 10px/1 var(--font-body); opacity: .9; min-height: 10px; }
.cell .tp, .cell .stx { position: absolute; top: 1px; font: 600 9px/1 var(--font-body); font-style: normal; }
.cell .tp { right: 4px; opacity: .85; }
.cell .stx { left: 4px; color: var(--star); }
.cell.free { background: var(--surface); color: var(--ink); border: 1px dashed var(--line); }
.cell.free .stx { color: var(--star); }
.cell.dim { opacity: .28; }
.cell[data-st="book"], .pill[data-st="book"], .key[data-st="book"], .hotchip[data-st="book"] { background: var(--book-bg); color: var(--book); }
.cell[data-st="dep"], .pill[data-st="dep"], .key[data-st="dep"], .hotchip[data-st="dep"] { background: var(--dep-bg); color: var(--dep); }
.cell[data-st="paid"], .pill[data-st="paid"], .key[data-st="paid"], .hotchip[data-st="paid"] { background: var(--paid-bg); color: var(--paid); }
.cell.free:hover { border-color: var(--accent); }
.hotchip { border-color: transparent; }
.hotchip b { color: var(--star); font-weight: 600; margin-right: 4px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card .top { display: flex; align-items: center; gap: 8px; }
.badge { font: 700 16px/1 var(--font-display); background: var(--surface2); border-radius: 8px; padding: 6px 9px; white-space: nowrap; }
.card .tags { color: var(--muted); font-size: 12px; }
.card .tags .s { color: var(--star); }
.card .price { font: 600 17px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-left: auto; }
.card .what { overflow-wrap: anywhere; }
.card .what .cat { display: inline-block; font-size: 11px; background: var(--surface2); border-radius: 10px; padding: 0 8px; margin-right: 5px; }
.card .who { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; overflow-wrap: anywhere; }
.card .meta { font-size: 11px; color: var(--muted); }
.card .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill { border: 1px solid transparent; border-radius: 14px; min-height: 28px; padding: 0 12px; font-size: 13px; font-weight: 600; }
.spacer { flex: 1; }
.key { border-radius: 12px; padding: 0 10px; font-weight: 500; }
.empty { text-align: center; padding: 26px 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty p { margin: 0; max-width: 36ch; }
.empty strong { color: var(--ink); font: 600 15px var(--font-display); }

/* แผ่นด้านล่าง */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 520px; max-height: 96%; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 10px; margin: 0;
}
.shead { display: flex; align-items: center; gap: 6px; }
.shead .ttl { flex: 1; text-align: center; font: 700 18px/1.2 var(--font-display); min-width: 0; overflow-wrap: anywhere; }
.shead .ttl small { display: block; font: 400 11px var(--font-body); color: var(--muted); }
.iconbtn { flex: none; width: 34px; height: 34px; padding: 0; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font: 600 18px/1 var(--font-display); }
.iconbtn:disabled { opacity: .3; cursor: not-allowed; }
.sacts { display: flex; gap: 8px; flex-wrap: wrap; }
.sacts .primary { flex: 1 1 150px; min-height: 42px; }
.stars { display: flex; gap: 0; justify-content: flex-end; }
.stars button { width: 30px; height: 34px; padding: 0; border: 0; background: transparent; font-size: 22px; line-height: 1; color: var(--line); }
.stars button[aria-pressed="true"] { color: var(--star); }
.two { display: grid; grid-template-columns: 1.15fr 1fr; gap: 8px; align-items: center; }
.zrow { display: grid; grid-template-columns: 1fr 1fr 1.5fr auto; gap: 6px; padding: 8px; background: var(--bg); border-radius: 10px; align-items: end; }
.zrow .nm { grid-column: 1 / 4; }
.zrow .del { grid-column: 4; grid-row: 1; align-self: end; }
.zrow .field { gap: 2px; }
.zrow input, .zrow select { min-height: 34px; font-size: 14px; padding: 0 8px; }
.gen { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; background: var(--bg); border-radius: 10px; }
.gen .full { grid-column: 1 / -1; }
.gen input, .gen select { min-height: 34px; font-size: 14px; padding: 0 8px; }
.gen .field { gap: 2px; }
.opt { display: flex; flex-direction: column; align-items: flex-start; gap: 0; width: 100%; text-align: left; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.opt b { font-weight: 600; font-size: 14px; }
.opt span { font-size: 12px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 9px; font-size: 13px; z-index: 30;
  max-width: calc(100% - 28px); pointer-events: none; text-align: center;
}
.toast[data-k="err"] { background: var(--danger); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

      if (!(Number.isInteger(zz.from) && Number.isInteger(zz.to) && zz.from >= 0 && zz.to >= zz.from && zz.to - zz.from < 300)) {
        toast("โซน " + z + ": เลขล็อคไม่ถูกต้อง (ล็อคสุดท้ายต้องไม่น้อยกว่าล็อคแรก และไม่เกิน 300 ล็อค)", "err"); return;
      }

  function buildBackup() {
    return { app: "lockbook", version: 2, exportedAt: Date.now(), events: events.map(function (e) { return Object.assign({}, e); }), bookings: rows.map(function (r) { return Object.assign({}, r); }) };

  function backupName() { var d = new Date(); return "สำรองล็อค-" + d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + ".json"; }
  function markBackup() { store.set("lastBackup", Date.now()); }
  function canShareFiles() {
    try {
      if (env.claude || !navigator.canShare || !navigator.share) return false;
      return navigator.canShare({ files: [new File(["{}"], "a.json", { type: "application/json" })] });
    } catch (e) { return false; }
  }
  function canPick() { return !env.claude && typeof window.showSaveFilePicker === "function"; }

  async function backupSaveFile() {
    var text = JSON.stringify(buildBackup()), fn = backupName();
    try {
      if (canPick()) {
        try {
          var fh = await window.showSaveFilePicker({ suggestedName: fn, types: [{ description: "ไฟล์สำรอง", accept: { "application/json": [".json"] } }] });
          var w = await fh.createWritable(); await w.write(text); await w.close();
          markBackup(); toast("บันทึกไฟล์สำรองแล้ว"); showBackup(); return;
        } catch (e) { if (e && e.name === "AbortError") return; }
      }
      if (!downloads) { toast("เบราว์เซอร์นี้ดาวน์โหลดไม่ได้ ลองคัดลอกเป็นข้อความ", "err"); return; }
      await downloads.save({ filename: fn, data: text });
      markBackup(); toast("บันทึกไฟล์สำรองแล้ว"); showBackup();
    } catch (e) { if (!(e && e.code === "declined")) toast("สำรองไม่สำเร็จ", "err"); }
  }
  async function backupShare() {
    var text = JSON.stringify(buildBackup());
    try {
      var file = new File([text], backupName(), { type: "application/json" });
      await navigator.share({ files: [file], title: "สำรองข้อมูลสมุดจองล็อค" });
      markBackup(); showBackup();
    } catch (e) { if (!(e && e.name === "AbortError")) toast("แชร์ไม่สำเร็จ", "err"); }
  }
  function backupCopy() {
    var text = JSON.stringify(buildBackup());
    var p = navigator.clipboard && navigator.clipboard.writeText(text);
    if (p && p.then) p.then(function () { markBackup(); toast("คัดลอกแล้ว นำไปวางเก็บในโน้ตหรือแชท"); showBackup(); }, function () { toast("คัดลอกไม่ได้ ใช้บันทึกเป็นไฟล์แทน", "err"); });
    else toast("คัดลอกไม่ได้ ใช้บันทึกเป็นไฟล์แทน", "err");
  }

  function openBackup() { showBackup(); }
  function showBackup() {
    var ov = openOverlay();
    var last = store.get("lastBackup", 0);
    var fileIn = h("input", { type: "file", accept: ".json,application/json", hidden: true, "aria-label": "เลือกไฟล์สำรอง" });
    fileIn.addEventListener("change", function () {
      var f = fileIn.files && fileIn.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { previewRestore(String(rd.result || "")); };
      rd.onerror = function () { toast("อ่านไฟล์ไม่ได้", "err"); };
      rd.readAsText(f);
    });
    var pasteBox = h("textarea", { id: "paste", placeholder: "หรือวางข้อความสำรองที่คัดลอกไว้ที่นี่", "aria-label": "ข้อความสำรอง", hidden: true });
    ov.append(h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "สำรองและกู้คืน" },
      h("div", { class: "shead" }, h("div", { class: "ttl", style: "text-align:left" }, "สำรอง / กู้คืนข้อมูล"),
        h("button", { type: "button", class: "iconbtn", "aria-label": "ปิด", onclick: closeOverlay }, "✕")),
      h("p", { class: "sub" }, "ข้อมูลหลักเก็บบนระบบออนไลน์อยู่แล้ว ไฟล์สำรองใช้เก็บอีกชุดไว้ที่ที่คุณเลือก ตอนนี้มี " + events.length + " งาน " + rows.length + " รายการจอง" +
        (last ? " · สำรองล่าสุด " + new Date(last).toLocaleString("th-TH", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : " · ยังไม่เคยสำรอง")),
      h("button", { type: "button", class: "opt", onclick: backupSaveFile },
        h("b", null, "บันทึกเป็นไฟล์"), h("span", null, canPick() ? "เลือกโฟลเดอร์หรือไดรฟ์ที่จะเก็บเอง" : "ดาวน์โหลดไฟล์ .json ลงเครื่อง")),
      canShareFiles() ? h("button", { type: "button", class: "opt", onclick: backupShare },
        h("b", null, "แชร์ไปแอปอื่น"), h("span", null, "Google Drive, LINE, อีเมล หรือแอปที่เลือก")) : null,
      h("button", { type: "button", class: "opt", onclick: backupCopy },
        h("b", null, "คัดลอกเป็นข้อความ"), h("span", null, "วางเก็บในโน้ตหรือแชทของตัวเอง")),
      h("div", { class: "lbl", style: "margin-top:4px" }, "กู้คืน"),
      h("button", { type: "button", class: "opt", disabled: state.ro, onclick: function () { fileIn.click(); } },
        h("b", null, "กู้คืนจากไฟล์สำรอง"), h("span", null, "เลือกไฟล์ .json ที่เคยสำรองไว้")),
      h("button", { type: "button", class: "btn small", onclick: function () { pasteBox.hidden = !pasteBox.hidden; chk.hidden = pasteBox.hidden; if (!pasteBox.hidden) pasteBox.focus(); } }, "กู้คืนจากข้อความที่คัดลอก"),
      pasteBox,
      fileIn));
    var chk = h("button", { type: "button", class: "btn small", hidden: true, onclick: function () { previewRestore(pasteBox.value); } }, "ตรวจข้อมูล");
    pasteBox.after(chk);
  }

  function sanitizeBackup(txt) {
    var o;
    try { o = JSON.parse(txt); } catch (e) { throw "ไฟล์นี้ไม่ใช่ไฟล์สำรองที่อ่านได้"; }
    if (!o || o.app !== "lockbook" || !Array.isArray(o.events) || !Array.isArray(o.bookings)) throw "ไฟล์นี้ไม่ใช่ไฟล์สำรองของสมุดจองล็อค";
    if (o.events.length > 200 || o.bookings.length > 20000) throw "ไฟล์ใหญ่เกินไป";
    var okId = /^[A-Za-z0-9_\-]{1,100}$/;
    var str = function (v, n) { return typeof v === "string" ? v.slice(0, n) : ""; };
    var num = function (v) { return typeof v === "number" && isFinite(v) ? v : null; };
    var evs = [], bks = [];
    o.events.forEach(function (e) {
      if (!e || !okId.test(e.id || "") || typeof e.name !== "string") return;
      var stars = {};
      if (e.stars && typeof e.stars === "object") Object.keys(e.stars).forEach(function (k) {
        var v = e.stars[k]; if (okId.test(k) && typeof v === "number" && v >= 0 && v <= 5) stars[k] = Math.round(v);
      });
      var zones = (Array.isArray(e.zones) ? e.zones : []).filter(function (z) { return z && typeof z.z === "string" && Number.isInteger(z.from) && Number.isInteger(z.to) && z.to >= z.from && z.to - z.from < 300; })
        .map(function (z) { return { z: z.z.slice(0, 20).replace(/\|/g, ""), from: z.from, to: z.to, t: z.t === "q" ? "q" : "a" }; });
      evs.push({ id: e.id, data: { name: str(e.name, 120), date: str(e.date, 80), zones: zones, stars: stars, by: str(e.by, 60) || null, ts: num(e.ts) || Date.now(), created: num(e.created) || num(e.ts) || Date.now() } });
    });
    o.bookings.forEach(function (b) {
      if (!b || !okId.test(b.id || "") || typeof b.eid !== "string" || typeof b.zone !== "string" || typeof b.lock !== "string") return;
      bks.push({ id: b.id, data: {
        eid: str(b.eid, 100), zone: str(b.zone, 20), lock: str(b.lock, 12), price: num(b.price), cat: str(b.cat, 30), product: str(b.product, 200),
        name: str(b.name, 100), phone: str(b.phone, 30), status: STATUS[b.status] ? b.status : "book", ltype: b.ltype === "a" || b.ltype === "q" ? b.ltype : "",
        by: str(b.by, 60) || null, ts: num(b.ts) || Date.now(), created: num(b.created) || num(b.ts) || Date.now()
      } });
    });
    if (!evs.length && !bks.length) throw "ไม่พบข้อมูลในไฟล์สำรอง";
    return { events: evs, bookings: bks, exportedAt: num(o.exportedAt) };
  }
  function previewRestore(txt) {
    var p;
    try { p = sanitizeBackup(txt); } catch (msg) { toast(String(msg), "err"); return; }
    var ov = openOverlay();
    var prog = h("p", { class: "sub", id: "rs-prog" });
    var go1 = h("button", { type: "button", class: "btn primary", onclick: function () { runRestore(p, go1, prog); } }, "กู้คืนข้อมูล");
    ov.append(h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "ยืนยันการกู้คืน" },
      h("div", { class: "shead" }, h("div", { class: "ttl", style: "text-align:left" }, "ยืนยันการกู้คืน"),
        h("button", { type: "button", class: "iconbtn", "aria-label": "ปิด", onclick: closeOverlay }, "✕")),
      h("p", null, "พบ " + p.events.length + " งาน และ " + p.bookings.length + " รายการจอง" + (p.exportedAt ? " (สำรองเมื่อ " + new Date(p.exportedAt).toLocaleString("th-TH") + ")" : "")),
      h("p", { class: "sub" }, "ข้อมูลที่รหัสตรงกันจะถูกแทนที่ด้วยข้อมูลในไฟล์ ข้อมูลอื่นที่มีอยู่ตอนนี้จะไม่ถูกลบ"),
      prog,
      h("div", { class: "sacts" }, go1, h("button", { type: "button", class: "btn", onclick: showBackup }, "ยกเลิก"))));
  }
  async function runRestore(p, btn, prog) {
    if (!db || state.ro) { toast("บัญชีนี้กู้คืนไม่ได้", "err"); return; }
    btn.disabled = true;
    var items = [];
    p.events.forEach(function (e) { items.push(["events/" + e.id, e.data]); });
    p.bookings.forEach(function (b) { items.push(["bookings/" + b.id, b.data]); });
    var done = 0, fail = 0;
    for (var i = 0; i < items.length; i += 4) {
      await Promise.all(items.slice(i, i + 4).map(function (it) {
        return db.doc(it[0]).set(it[1]).then(function () { done++; }, function () { fail++; });
      }));
      prog.textContent = "กำลังกู้คืน " + (done + fail) + "/" + items.length;
    }
    toast(fail ? "กู้คืนแล้ว " + done + " รายการ ไม่สำเร็จ " + fail : "กู้คืนครบ " + done + " รายการ", fail ? "err" : "");
    closeOverlay();
  }

  /* ---------- ข้อมูล ---------- */
  async function resolveNames() {
    if (!user) return;
    var ids = Array.from(new Set(rows.map(function (r) { return r.by; }).filter(Boolean)));
    if (!ids.length) return;
    var ps = await user.profiles(ids), changed = false;
    ids.forEach(function (id) { var n = (ps[id] && ps[id].name) || ""; if (names[id] !== n) { names[id] = n; changed = true; } });
    if (changed && state.mode === "list" && state.view === "event") render();
  }
  function snapMeta(snap) { setSync(snap.metadata.hasPendingWrites ? "busy" : "ok", snap.metadata.hasPendingWrites ? "กำลังส่ง" : (db && db.local ? "เก็บในเครื่องนี้" : "ซิงก์แล้ว")); }
  function onEvents(snap) {
    events = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
    eventsById = new Map(events.map(function (e) { return [e.id, e]; }));
    loaded.events = true; snapMeta(snap);
    if (!state.autoOpened && state.view === "events") {
      state.autoOpened = true;
      var last = store.get("lastEid", null);
      if (last && eventsById.has(last)) { state.view = "event"; state.eid = last; }
    }
    render();
  }
  function onBookings(snap) {
    rows = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
    rowsById = new Map(rows.map(function (r) { return [r.id, r]; }));
    rowsByEvent = {};
    rows.forEach(function (r) { (rowsByEvent[r.eid] = rowsByEvent[r.eid] || []).push(r); });
    loaded.bookings = true; snapMeta(snap);
    render(); resolveNames();
  }
  function subscribe() {
    var err = function (e) { setSync("err", "การเชื่อมต่อขัดข้อง"); if (e && e.code === "permission-denied") setRO("Firestore ไม่อนุญาตให้เข้าถึง ตรวจ Rules ในไฟล์ firestore.rules"); };
    db.collection("events").onSnapshot(onEvents, err);
    db.collection("bookings").onSnapshot(onBookings, err);
  }

  function browserDownloads() {
    return { save: async function (r) {
      var json = /\.json$/i.test(r.filename);
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([r.data], { type: json ? "application/json" : "text/csv;charset=utf-8" }));
      a.download = r.filename; document.body.append(a); a.click(); a.remove();
      return { status: "saved" };
    } };
  }
  function deepMerge(a, b) {
    var o = Object.assign({}, a);
    Object.keys(b).forEach(function (k) {
      var v = b[k];
      if (v && typeof v === "object" && !Array.isArray(v)) o[k] = deepMerge(o[k] && typeof o[k] === "object" && !Array.isArray(o[k]) ? o[k] : {}, v);
      else o[k] = v;
    });
    return o;
  }
  function firebaseDb() {
    var fs = firebase.firestore();
    return {
      collection: function (p) {
        return { onSnapshot: function (next, error) {
          return fs.collection(p).onSnapshot({ includeMetadataChanges: true }, function (s) {
            next({ docs: s.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; }), metadata: { hasPendingWrites: s.metadata.hasPendingWrites } });
          }, error);
        } };
      },
      doc: function (p) {
        var q = p.split("/"), r = fs.collection(q[0]).doc(q[1]);
        return {
          set: function (d) { return r.set(d); },
          update: function (d) { return r.update(d); },
          merge: function (d) { return r.set(d, { merge: true }); },
          delete: function () { return r.delete(); }
        };
      }
    };
  }
  function claudeDb(raw) {
    return {
      collection: function (p) { return raw.collection(p); },
      doc: function (p) {
        var d = raw.doc(p);
        return { set: function (x) { return d.set(x); }, update: function (x) { return d.update(x); }, merge: function (x) { return d.update(x); }, delete: function () { return d.delete(); } };
      }
    };
  }
  function localDb() {
    var subs = {};
    function load(c) { try { return JSON.parse(localStorage.getItem("lockbook." + c) || "{}"); } catch (e) { return {}; } }
    function put(c, o) { try { localStorage.setItem("lockbook." + c, JSON.stringify(o)); } catch (e) {} }
    function emit(c) {
      var o = load(c);
      var docs = Object.keys(o).map(function (id) { return { id: id, data: function () { return o[id]; } }; });
      (subs[c] || []).forEach(function (f) { f({ docs: docs, metadata: { hasPendingWrites: false } }); });
    }
    return {
      local: true,
      collection: function (c) { return { onSnapshot: function (n) { (subs[c] = subs[c] || []).push(n); emit(c); return function () {}; } }; },
      doc: function (p) {
        var q = p.split("/"), c = q[0], id = q[1];
        function m(d) { var o = load(c); o[id] = deepMerge(o[id] || {}, d); put(c, o); emit(c); }
        return {
          set: async function (d) { var o = load(c); o[id] = JSON.parse(JSON.stringify(d)); put(c, o); emit(c); },
          update: async function (d) { m(d); },
          merge: async function (d) { m(d); },
          delete: async function () { var o = load(c); delete o[id]; put(c, o); emit(c); }
        };
      }
    };
  }

  /* ---------- wiring ---------- */
  $("#back").addEventListener("click", function () { go("events"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#overlay").hidden) closeOverlay(); });
  render();

  (async function init() {
    var c = window.claude;
    if (!c || !c.use) {
      downloads = browserDownloads();
      var cfg = window.FIREBASE_CONFIG;
      if (cfg && cfg.apiKey && window.firebase) {
        try {
          firebase.initializeApp(cfg);
          var cred = await firebase.auth().signInAnonymously();
          uid = cred.user.uid; db = firebaseDb();
        } catch (e) {
          setSync("err", "เชื่อม Firebase ไม่ได้");
          setRO("เชื่อม Firebase ไม่สำเร็จ ตรวจค่า FIREBASE_CONFIG ใน index.html และเปิด Anonymous ใน Authentication");
          return;
        }
      } else { db = localDb(); }
      subscribe(); return;
    }
    env.claude = true;
    try { user = await c.use("user"); } catch (e) { user = null; }
    try { downloads = await c.use("downloads"); } catch (e) { downloads = null; }
    var raw = null;
    try { raw = await c.use("db"); } catch (e) { raw = null; }
    if (user) {
      try { uid = await user.id(); } catch (e) { uid = null; }
      try { if ((await user.can("data.write")) === false) setRO("บัญชีนี้ดูข้อมูลได้อย่างเดียว ขอสิทธิ์ผู้ร่วมแก้ไขจากเจ้าของเพจถ้าต้องการบันทึก"); } catch (e) {}
    }
    if (!raw) { setSync("err", "ไม่ได้เชื่อมต่อ"); setRO("ยังเชื่อมต่อฐานข้อมูลไม่ได้ ลองเข้าสู่ระบบ claude.ai แล้วเปิดหน้านี้ใหม่"); return; }
    db = claudeDb(raw);
    subscribe();
  })();
})();
</script>
