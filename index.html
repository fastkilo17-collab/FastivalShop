<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สมุดจองล็อค</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
<style>
/* Layout: งานเทศกาล (รายการ) → ผังโซนและเลขล็อค → แตะเลขล็อคเปิดแผ่นบันทึกจากด้านล่าง.
   Colors follow stall colors on a festival floor plan: magenta accent; amber / blue / green for booking state. */
:root {
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-display: "Prompt", "IBM Plex Sans Thai", system-ui, sans-serif;
  --bg: #f1f2f7;
  --surface: #ffffff;
  --surface2: #e7e9f1;
  --ink: #1b1f2e;
  --muted: #596078;
  --line: #d6d9e4;
  --accent: #c2185b;
  --accent-ink: #ffffff;
  --book: #8a5700;
  --book-bg: #fcecc6;
  --dep: #1a56b0;
  --dep-bg: #d9e7fb;
  --paid: #17703d;
  --paid-bg: #d3f0df;
  --warn-bg: #fff0cf;
  --warn-ink: #6b4300;
  --danger: #b3261e;
  --scrim: rgba(10, 12, 20, .55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1b1e28; --surface2: #262a37; --ink: #eceef6; --muted: #9aa2b8; --line: #333849;
    --accent: #ff6aa6; --accent-ink: #2a0618;
    --book: #f2c25b; --book-bg: #3a2d10; --dep: #8bb6ff; --dep-bg: #172a4a; --paid: #6fd69a; --paid-bg: #123222;
    --warn-bg: #3a2d10; --warn-ink: #f6d58e; --danger: #ff8f86; --scrim: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1b1e28; --surface2: #262a37; --ink: #eceef6; --muted: #9aa2b8; --line: #333849;
  --accent: #ff6aa6; --accent-ink: #2a0618;
  --book: #f2c25b; --book-bg: #3a2d10; --dep: #8bb6ff; --dep-bg: #172a4a; --paid: #6fd69a; --paid-bg: #123222;
  --warn-bg: #3a2d10; --warn-ink: #f6d58e; --danger: #ff8f86; --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body);
  padding-block: 14px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hl { display: flex; align-items: flex-start; gap: 10px; min-width: 0; flex: 1; }
.back { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: 600 26px/1 var(--font-display); }
h1 { font: 600 24px/1.25 var(--font-display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font: 600 18px/1.3 var(--font-display); margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"] .dot { background: var(--paid); }
.sync[data-s="busy"] .dot { background: var(--book); }
.sync[data-s="err"] .dot { background: var(--danger); }

.stack { display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.lbl { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
input[type=text], input[type=tel], input[type=search], input[type=number], select {
  width: 100%; min-height: 48px; padding: 0 14px; font-size: 17px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; min-width: 0;
}
input::placeholder { color: var(--muted); opacity: .7; }
.price-wrap { position: relative; }
.price-wrap span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 17px; pointer-events: none; }
.price-wrap input { padding-left: 34px; font: 600 24px/1 var(--font-display); min-height: 58px; font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip.ghost { border-style: dashed; color: var(--muted); }
.btn { min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font: 600 17px/1 var(--font-display); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.seg.st button[aria-pressed="true"][data-st="book"] { background: var(--book-bg); color: var(--book); border-color: var(--book); }
.seg.st button[aria-pressed="true"][data-st="dep"] { background: var(--dep-bg); color: var(--dep); border-color: var(--dep); }
.seg.st button[aria-pressed="true"][data-st="paid"] { background: var(--paid-bg); color: var(--paid); border-color: var(--paid); }

/* รายการงาน */
.evlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.evcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.evcard .nm { font: 600 18px/1.3 var(--font-display); overflow-wrap: anywhere; }
.evcard .mt { color: var(--muted); font-size: 13px; }
.prog { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.evcard .ft { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }

/* ผังล็อค */
.summary { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.summary div { display: flex; flex-direction: column; min-width: 0; }
.summary b { font: 600 24px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.summary small { color: var(--muted); font-size: 12px; }
.zgroup { display: flex; flex-direction: column; gap: 8px; }
.zgroup h3 { margin: 0; font: 600 16px/1.3 var(--font-display); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.zgroup h3 span { font: 400 13px var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.cell { min-height: 54px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 2px; border: 1px solid color-mix(in srgb, currentColor 35%, transparent); font: 600 17px/1.1 var(--font-display); }
.cell small { font: 500 10px/1 var(--font-body); opacity: .85; min-height: 10px; font-variant-numeric: tabular-nums; }
.cell.free { background: var(--surface); color: var(--ink); border: 1px dashed var(--line); }
.cell.dim { opacity: .2; }
.cell[data-st="book"], .pill[data-st="book"], .key[data-st="book"] { background: var(--book-bg); color: var(--book); }
.cell[data-st="dep"], .pill[data-st="dep"], .key[data-st="dep"] { background: var(--dep-bg); color: var(--dep); }
.cell[data-st="paid"], .pill[data-st="paid"], .key[data-st="paid"] { background: var(--paid-bg); color: var(--paid); }
.cell.free:hover { border-color: var(--accent); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card .top { display: flex; align-items: center; gap: 10px; }
.badge { font: 700 20px/1 var(--font-display); background: var(--surface2); border-radius: 10px; padding: 8px 10px; white-space: nowrap; }
.card .price { font: 600 20px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-left: auto; }
.card .what { overflow-wrap: anywhere; }
.card .what .cat { display: inline-block; font-size: 12px; background: var(--surface2); border-radius: 12px; padding: 1px 10px; margin-right: 6px; }
.card .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; overflow-wrap: anywhere; }
.card .meta { font-size: 12px; color: var(--muted); }
.card .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { border: 1px solid transparent; border-radius: 16px; min-height: 36px; padding: 0 14px; font-size: 14px; font-weight: 600; }
.spacer { flex: 1; }
.key { border-radius: 14px; padding: 2px 12px; font-weight: 500; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty p { margin: 0; max-width: 36ch; }
.empty strong { color: var(--ink); font: 600 17px var(--font-display); }

/* แผ่นบันทึกจากด้านล่าง */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; margin: 0;
}
.shead { display: flex; align-items: center; gap: 8px; }
.shead .ttl { flex: 1; text-align: center; font: 700 20px/1.2 var(--font-display); min-width: 0; }
.shead .ttl small { display: block; font: 400 12px var(--font-body); color: var(--muted); overflow-wrap: anywhere; }
.iconbtn { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: 600 22px/1 var(--font-display); }
.iconbtn:disabled { opacity: .35; cursor: not-allowed; }
.sacts { display: flex; gap: 10px; flex-wrap: wrap; }
.sacts .primary { flex: 1 1 180px; min-height: 54px; }
.zrow { display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: 8px; align-items: end; }
.zrow .field { gap: 4px; }
.zrow input { min-height: 44px; font-size: 16px; padding: 0 10px; }
.gen { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.gen .btn { grid-column: 1 / -1; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 30;
  max-width: calc(100% - 32px); pointer-events: none; text-align: center;
}
.toast[data-k="err"] { background: var(--danger); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
/* ค่าเชื่อมต่อ Firebase (เปิดเผยในเว็บได้ตามปกติของ Firebase ความปลอดภัยอยู่ที่ firestore.rules) */

</head>
<body>
<div class="wrap">
  <header>
    <div class="hl">
      <button type="button" class="back" id="back" aria-label="กลับไปรายการงาน" hidden>‹</button>
      <div style="min-width:0">
        <h1 id="ttl">สมุดจองล็อค</h1>
        <p class="sub" id="sub"></p>
      </div>
    </div>
    <span class="sync" id="sync" data-s="busy" role="status"><i class="dot"></i><span id="syncTxt">กำลังเชื่อมต่อ</span></span>
  </header>
  <div class="notice" id="roNote" hidden></div>
  <main id="main"></main>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var STATUS = { book: "จอง", dep: "มัดจำแล้ว", paid: "จ่ายครบ" };
  var NEXT = { book: "dep", dep: "paid", paid: "book" };
  var CATS = ["อาหาร", "เครื่องดื่ม", "ของทอด", "ปิ้งย่าง", "ขนม", "ผลไม้", "แฟชั่น", "กระทง", "ของใช้", "ของเล่น"];
  var collator = new Intl.Collator("th", { numeric: true, sensitivity: "base" });
  var fmt = function (n) { return Number(n).toLocaleString("th-TH"); };
  function short(p) { p = Number(p); return p >= 1000 ? (Math.round(p / 100) / 10) + "k" : String(p); }

  var db = null, user = null, downloads = null, uid = null;
  var events = [], eventsById = new Map(), rows = [], rowsById = new Map(), rowsByEvent = {}, names = {};
  var loaded = { events: false, bookings: false };
  var state = { view: "events", eid: null, mode: "map", fStatus: "", q: "", ro: false, busy: false, autoOpened: false };
  var sheet = null, evEdit = null;

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === "class") el.className = v;
      else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (kid) {
        if (kid == null || kid === false) return;
        el.append(kid.nodeType ? kid : document.createTextNode(kid));
      });
    }
    return el;
  }
  function keyOf(eid, z, l) { return [eid, z, l].map(function (s) { return String(s).trim().toLowerCase(); }).join("|"); }
  function idOf(k) {
    var h1 = 5381, h2 = 0x811c9dc5;
    for (var i = 0; i < k.length; i++) { var c = k.charCodeAt(i); h1 = ((h1 * 33) ^ c) >>> 0; h2 = Math.imul(h2 ^ c, 16777619) >>> 0; }
    return "b_" + h1.toString(36) + h2.toString(36);
  }
  function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  var toastTimer;
  function toast(msg, kind) {
    var t = $("#toast"); t.textContent = msg; t.dataset.k = kind || ""; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }
  function setSync(s, txt) { $("#sync").dataset.s = s; $("#syncTxt").textContent = txt; }
  function setRO(msg) { state.ro = true; var n = $("#roNote"); n.textContent = msg; n.hidden = false; }

  /* ---------- ข้อมูลของงาน ---------- */
  function zoneList(ev) {
    var out = [], map = {};
    (ev.zones || []).forEach(function (zz) {
      var g = { z: zz.z, locks: [], set: {} };
      for (var i = zz.from; i <= zz.to; i++) { g.locks.push(String(i)); g.set[String(i)] = 1; }
      out.push(g); map[zz.z] = g;
    });
    (rowsByEvent[ev.id] || []).forEach(function (r) {
      var g = map[r.zone];
      if (!g) { g = { z: r.zone, locks: [], set: {} }; out.push(g); map[r.zone] = g; }
      if (!g.set[r.lock]) { g.set[r.lock] = 1; g.locks.push(r.lock); g.extra = true; }
    });
    out.forEach(function (g) { if (g.extra) g.locks.sort(function (a, b) { return collator.compare(a, b); }); });
    return out;
  }
  function rowMatches(r, q) {
    var hay = [r.zone + "-" + r.lock, r.zone + r.lock, r.name, r.phone, r.product, r.cat].join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  /* ---------- หน้าจอ ---------- */
  function render() {
    var y = window.scrollY, ae = document.activeElement && document.activeElement.id;
    var ev = state.view === "event" ? eventsById.get(state.eid) : null;
    if (state.view === "event" && !ev && loaded.events) { state.view = "events"; state.eid = null; }
    var main = $("#main"); main.textContent = "";
    $("#back").hidden = state.view !== "event";
    if (state.view === "event" && ev) {
      $("#ttl").textContent = ev.name; $("#sub").textContent = ev.date || "แตะเลขล็อคเพื่อบันทึกข้อมูล";
      main.append(eventView(ev));
    } else {
      $("#ttl").textContent = "สมุดจองล็อค"; $("#sub").textContent = "เลือกงาน แล้วแตะเลขล็อคเพื่อบันทึก";
      main.append(eventsView());
    }
    window.scrollTo(0, y);
    if (ae === "q" && $("#q")) { var q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  function go(view, eid) {
    state.view = view; state.eid = eid || null; state.q = ""; state.fStatus = "";
    if (eid) store.set("lastEid", eid);
    render(); window.scrollTo(0, 0);
  }

  function eventsView() {
    var box = h("div", { class: "stack" });
    box.append(h("div", { class: "bar" }, h("h2", null, "งานเทศกาล"),
      h("button", { type: "button", class: "btn primary small", onclick: function () { openEventEditor(null); } }, "+ งานใหม่")));
    if (!loaded.events) { box.append(h("p", { class: "sub" }, "กำลังโหลดข้อมูล")); return box; }
    if (!events.length) {
      box.append(h("div", { class: "empty" }, h("strong", null, "ยังไม่มีงาน"),
        h("p", null, "สร้างงานแรก ตั้งชื่อและจำนวนโซนกับล็อค แล้วจะได้ผังล็อคให้แตะบันทึกทีละช่อง"),
        h("button", { type: "button", class: "btn primary", onclick: function () { openEventEditor(null); } }, "สร้างงานแรก")));
      return box;
    }
    var list = h("div", { class: "evlist" });
    events.slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); }).forEach(function (ev) {
      var zl = zoneList(ev), total = zl.reduce(function (s, g) { return s + g.locks.length; }, 0);
      var rs = rowsByEvent[ev.id] || [], sum = rs.reduce(function (s, r) { return s + (Number(r.price) || 0); }, 0);
      var pct = total ? Math.min(100, Math.round(rs.length / total * 100)) : 0;

              if (!(a >= 65 && b <= 90 && a <= b) || !(n >= 1 && n <= 300)) { toast("ใส่โซนเป็นตัวอักษร A–Z และจำนวนล็อค 1–300", "err"); return; }
              evEdit.zones = []; for (var c = a; c <= b; c++) evEdit.zones.push({ z: String.fromCharCode(c), from: 1, to: n });
              paintRows(); toast("สร้าง " + evEdit.zones.length + " โซนแล้ว");
            }
          }, "สร้างโซนตามนี้"))),
      h("div", { class: "field" }, h("span", { class: "lbl" }, "โซนและเลขล็อค"), rowsBox,
        h("button", { type: "button", class: "btn small", onclick: function () { evEdit.zones.push({ z: "", from: 1, to: 20 }); paintRows(); } }, "+ เพิ่มโซน")),
      h("div", { class: "sacts" },
        h("button", { type: "button", class: "btn primary", id: "ev-save", onclick: saveEvent }, evEdit.id ? "บันทึกการแก้ไข" : "สร้างงาน"),
        delBtn));
    ov.append(panel);
    if (!evEdit.id) setTimeout(function () { nameIn.focus(); }, 30);
  }
  async function saveEvent() {
    if (!db || state.ro || state.busy) return;
    var name = evEdit.name.trim();
    if (!name) { toast("ใส่ชื่องานก่อน", "err"); $("#ev-name").focus(); return; }
    var seen = {}, zones = [];
    for (var i = 0; i < evEdit.zones.length; i++) {
      var zz = evEdit.zones[i], z = (zz.z || "").trim().toUpperCase();
      if (!z) continue;
      if (seen[z]) { toast("ชื่อโซน " + z + " ซ้ำกัน", "err"); return; }
      if (!(Number.isInteger(zz.from) && Number.isInteger(zz.to) && zz.from >= 0 && zz.to >= zz.from && zz.to - zz.from < 300)) {
        toast("โซน " + z + ": เลขล็อคไม่ถูกต้อง (ล็อคสุดท้ายต้องไม่น้อยกว่าล็อคแรก และไม่เกิน 300 ล็อค)", "err"); return;
      }
      seen[z] = 1; zones.push({ z: z, from: zz.from, to: zz.to });
    }
    var id = evEdit.id || newId("e_"), now = Date.now();
    state.busy = true; $("#ev-save").disabled = true;
    try {
      await db.doc("events/" + id).set({ name: name, date: evEdit.date.trim(), zones: zones, by: uid || null, ts: now, created: evEdit.created || now });
      var isNew = !evEdit.id;
      closeOverlay(); toast(isNew ? "สร้างงานแล้ว" : "บันทึกแล้ว");
      if (isNew) go("event", id);
    } catch (e) {
      toast(e && (e.code === "invalid_argument" || e.code === "permission-denied") ? "บัญชีนี้บันทึกไม่ได้" : "บันทึกไม่สำเร็จ ลองอีกครั้ง", "err");
      var b = $("#ev-save"); if (b) b.disabled = false;
    } finally { state.busy = false; }
  }

  /* ---------- ส่งออก ---------- */
  function csvCell(v) { var s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  async function exportCsv(ev) {
    if (!downloads) return;
    var list = (rowsByEvent[ev.id] || []).slice().sort(function (a, b) { return collator.compare(a.zone, b.zone) || collator.compare(a.lock, b.lock); });
    if (!list.length) { toast("ยังไม่มีรายการให้ส่งออก", "err"); return; }
    var lines = [["งาน", "โซน", "เลขล็อค", "ราคาปิดประมูล", "หมวด", "สินค้า", "ชื่อผู้ติดต่อ", "เบอร์โทร", "สถานะ", "บันทึกล่าสุด"].map(csvCell).join(",")];
    list.forEach(function (r) {
      lines.push([ev.name, r.zone, r.lock, r.price, r.cat, r.product, r.name, r.phone, STATUS[r.status] || "", r.ts ? new Date(r.ts).toLocaleString("th-TH") : ""].map(csvCell).join(","));
    });
    var safe = ev.name.replace(/[\\/:*?"<>|]/g, "").trim().slice(0, 60) || "งาน";
    try { await downloads.save({ filename: "จองล็อค-" + safe + ".csv", data: "﻿" + lines.join("\r\n") }); toast("ส่งออกแล้ว"); }
    catch (e) { if (!(e && e.code === "declined")) toast("ส่งออกไม่สำเร็จ", "err"); }
  }

  /* ---------- ข้อมูล ---------- */
  async function resolveNames() {
    if (!user) return;
    var ids = Array.from(new Set(rows.map(function (r) { return r.by; }).filter(Boolean)));
    if (!ids.length) return;
    var ps = await user.profiles(ids), changed = false;
    ids.forEach(function (id) { var n = (ps[id] && ps[id].name) || ""; if (names[id] !== n) { names[id] = n; changed = true; } });
    if (changed && state.mode === "list" && state.view === "event") render();
  }
  function snapMeta(snap) { setSync(snap.metadata.hasPendingWrites ? "busy" : "ok", snap.metadata.hasPendingWrites ? "กำลังส่ง" : (db && db.local ? "เก็บในเครื่องนี้" : "ซิงก์แล้ว")); }
  function onEvents(snap) {
    events = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
    eventsById = new Map(events.map(function (e) { return [e.id, e]; }));
    loaded.events = true; snapMeta(snap);
    if (!state.autoOpened && state.view === "events") {
      state.autoOpened = true;
      var last = store.get("lastEid", null);
      if (last && eventsById.has(last)) { state.view = "event"; state.eid = last; }
    }
    render();
  }
  function onBookings(snap) {
    rows = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
    rowsById = new Map(rows.map(function (r) { return [r.id, r]; }));
    rowsByEvent = {};
    rows.forEach(function (r) { (rowsByEvent[r.eid] = rowsByEvent[r.eid] || []).push(r); });
    loaded.bookings = true; snapMeta(snap);
    render(); resolveNames();
  }
  function subscribe() {
    var err = function (e) { setSync("err", "การเชื่อมต่อขัดข้อง"); if (e && e.code === "permission-denied") setRO("Firestore ไม่อนุญาตให้เข้าถึง ตรวจ Rules ในไฟล์ firestore.rules"); };
    db.collection("events").onSnapshot(onEvents, err);
    db.collection("bookings").onSnapshot(onBookings, err);
  }

  function browserDownloads() {
    return { save: async function (r) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([r.data], { type: "text/csv;charset=utf-8" }));
      a.download = r.filename; document.body.append(a); a.click(); a.remove();
      return { status: "saved" };
    } };
  }
  function firebaseDb() {
    var fs = firebase.firestore();
    return {
      collection: function (p) {
        return { onSnapshot: function (next, error) {
          return fs.collection(p).onSnapshot({ includeMetadataChanges: true }, function (s) {
            next({ docs: s.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; }), metadata: { hasPendingWrites: s.metadata.hasPendingWrites } });
          }, error);
        } };
      },
      doc: function (p) {
        var q = p.split("/"), r = fs.collection(q[0]).doc(q[1]);
        return { set: function (d) { return r.set(d); }, update: function (d) { return r.update(d); }, delete: function () { return r.delete(); } };
      }
    };
  }
  function localDb() {
    var subs = {};
    function load(c) { try { return JSON.parse(localStorage.getItem("lockbook." + c) || "{}"); } catch (e) { return {}; } }
    function put(c, o) { try { localStorage.setItem("lockbook." + c, JSON.stringify(o)); } catch (e) {} }
    function emit(c) {
      var o = load(c);
      var docs = Object.keys(o).map(function (id) { return { id: id, data: function () { return o[id]; } }; });
      (subs[c] || []).forEach(function (f) { f({ docs: docs, metadata: { hasPendingWrites: false } }); });
    }
    return {
      local: true,
      collection: function (c) { return { onSnapshot: function (n) { (subs[c] = subs[c] || []).push(n); emit(c); return function () {}; } }; },
      doc: function (p) {
        var q = p.split("/"), c = q[0], id = q[1];
        return {
          set: async function (d) { var o = load(c); o[id] = d; put(c, o); emit(c); },
          update: async function (d) { var o = load(c); o[id] = Object.assign({}, o[id], d); put(c, o); emit(c); },
          delete: async function () { var o = load(c); delete o[id]; put(c, o); emit(c); }
        };
      }
    };
  }

  /* ---------- wiring ---------- */
  $("#back").addEventListener("click", function () { go("events"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#overlay").hidden) closeOverlay(); });
  render();

  (async function init() {
    var c = window.claude;
    if (!c || !c.use) {
      downloads = browserDownloads();
      var cfg = window.FIREBASE_CONFIG;
      if (cfg && cfg.apiKey && window.firebase) {
        try {
          firebase.initializeApp(cfg);
          var cred = await firebase.auth().signInAnonymously();
          uid = cred.user.uid; db = firebaseDb();
        } catch (e) {
          setSync("err", "เชื่อม Firebase ไม่ได้");
          setRO("เชื่อม Firebase ไม่สำเร็จ ตรวจค่า FIREBASE_CONFIG ใน index.html และเปิด Anonymous ใน Authentication");
          return;
        }
      } else { db = localDb(); }
      subscribe(); return;
    }
    try { user = await c.use("user"); } catch (e) { user = null; }
    try { downloads = await c.use("downloads"); } catch (e) { downloads = null; }
    try { db = await c.use("db"); } catch (e) { db = null; }
    if (user) {
      try { uid = await user.id(); } catch (e) { uid = null; }
      try { if ((await user.can("data.write")) === false) setRO("บัญชีนี้ดูข้อมูลได้อย่างเดียว ขอสิทธิ์ผู้ร่วมแก้ไขจากเจ้าของเพจถ้าต้องการบันทึก"); } catch (e) {}
    }
    if (!db) { setSync("err", "ไม่ได้เชื่อมต่อ"); setRO("ยังเชื่อมต่อฐานข้อมูลไม่ได้ ลองเข้าสู่ระบบ claude.ai แล้วเปิดหน้านี้ใหม่"); return; }
    subscribe();
  })();
})();
</script>
</body>
